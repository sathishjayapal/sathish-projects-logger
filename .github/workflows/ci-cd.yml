name: CI/CD → Docker Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Build & Test ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # sathishlogger has no Maven Wrapper — use Maven from actions/setup-java
      - name: Build (skip tests)
        run: mvn package -DskipTests -B

      # Guards against the spring-boot-maven-plugin repackage goal being
      # skipped/misconfigured, which silently produces a plain (non-executable)
      # jar that fails at runtime with "no main manifest attribute".
      - name: Verify jar is executable (has Main-Class)
        run: |
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -n1)
          echo "Checking $JAR"
          if ! unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q '^Main-Class:'; then
            echo "::error::$JAR has no Main-Class manifest entry — spring-boot-maven-plugin repackage did not run"
            exit 1
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ── Docker Build & Push ───────────────────────────────────────────────────
  docker:
    name: Docker push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute the image name from a trimmed copy of the secret. A stray
      # trailing newline/whitespace on the DOCKERHUB_USERNAME secret value
      # (easy to introduce via copy-paste when setting it in GitHub) makes
      # env.IMAGE_NAME embed a newline, which silently splits each `tags:`
      # line in two and produces an invalid tag like "/sathishlogger:latest".
      - name: Compute image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          trimmed="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          if [ -z "$trimmed" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is empty"
            exit 1
          fi
          echo "name=$trimmed/sathishlogger" >> "$GITHUB_OUTPUT"

      # Build and load into the local daemon only — do NOT push yet. The image
      # must pass the smoke test below before it's allowed anywhere near
      # Docker Hub / production.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:latest
          cache-to: type=inline

      # Actually run the built image and hit its health endpoint. This is
      # what would have caught the "no main manifest attribute" crash-loop
      # before it ever reached production — a jar/docker build succeeding is
      # not the same as the app starting.
      - name: Smoke test container
        run: |
          set -e
          docker run -d --name smoke-test -p 8099:8080 "${{ steps.image.outputs.name }}:${{ github.sha }}"

          echo "Waiting for container to become healthy..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8099/api/logs/health > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' smoke-test | grep -q true; then
              echo "::error::Container exited before becoming healthy"
              docker logs smoke-test
              exit 1
            fi
            sleep 5
          done

          echo "::error::Container did not become healthy in time"
          docker logs smoke-test
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Write summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ steps.image.outputs.name }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA tag**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Watchtower** will auto-redeploy in ≤ 5 min" >> "$GITHUB_STEP_SUMMARY"
